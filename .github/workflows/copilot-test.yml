name: Copilot CLI Test

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  copilot-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Verify GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh --version

      - name: Install Copilot extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Installing GitHub Copilot CLI extension..."
          gh extension install github/gh-copilot || echo "Extension may already be installed or unavailable"

      - name: Test Copilot CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Testing Copilot CLI availability..."
          gh copilot --version || echo "Copilot CLI not available or authentication failed"

      - name: Update README with changelist (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "Base ref: ${BASE_REF}"
          echo "Head ref: ${HEAD_REF}"

          git fetch origin "${BASE_REF}"
          git fetch origin "${HEAD_REF}"

          echo "Generating changelist..."
          CHANGES=$(git diff --name-status "origin/${BASE_REF}...origin/${HEAD_REF}" | sed 's/^/ - /')
          if [ -z "${CHANGES}" ]; then
            CHANGES="(no file changes detected)"
          fi

          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Build the changelist block safely without heredocs to avoid YAML parsing issues
          NEW_BLOCK=$(printf "%s\n" \
"<!-- CHANGELOG:START -->" \
"## Latest PR Change List (auto-updated)" \
"" \
"Base: ${BASE_REF}" \
"Head: ${HEAD_REF}" \
"" \
"Changes:" \
"${CHANGES}" \
"" \
"Updated: ${TS}" \
"<!-- CHANGELOG:END -->")

          # Remove existing block if present, then append the new block
          if grep -q "<!-- CHANGELOG:START -->" README.md; then
            sed -i '/<!-- CHANGELOG:START -->/,/<!-- CHANGELOG:END -->/d' README.md
          fi
          printf "\n%s\n" "$NEW_BLOCK" >> README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md || true
          if git diff --cached --quiet; then
            echo "No README changes to commit."
          else
            git commit -m "docs(README): auto-update change list for PR ${{ github.event.pull_request.number }}"
            git push origin "HEAD:${HEAD_REF}"
          fi
