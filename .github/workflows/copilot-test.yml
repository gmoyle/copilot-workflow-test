name: Copilot CLI Test

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  copilot-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Verify GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: gh --version

      - name: Install Copilot extension
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          echo "Installing GitHub Copilot CLI extension..."
          gh extension install github/gh-copilot || echo "Extension may already be installed or unavailable"

      - name: Test Copilot CLI (non-interactive)
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          set -e
          echo "Testing Copilot CLI availability..."
          gh auth status || true
          gh copilot --version || echo "Copilot CLI not available or authentication failed"

          echo "Preparing diff for explanation..."
          BASE=${{ github.base_ref || 'main' }}
          git fetch origin "$BASE"
          git diff --unified=0 "origin/$BASE...HEAD" > changes.diff || true

          echo "Requesting explanation from Copilot..."
          gh copilot explain -f changes.diff > copilot_explanation.txt || echo "Copilot explain failed" > copilot_explanation.txt

          echo "### Copilot Explanation" >> "$GITHUB_STEP_SUMMARY"
          cat copilot_explanation.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Update README with changelist (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          PUSH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          set -euo pipefail
          echo "Base ref: ${BASE_REF}"
          echo "Head ref: ${HEAD_REF}"

          git fetch origin "${BASE_REF}"
          git fetch origin "${HEAD_REF}"

          echo "Generating changelist..."
          CHANGES=$(git diff --name-status "origin/${BASE_REF}...origin/${HEAD_REF}" | sed 's/^/ - /')
          if [ -z "${CHANGES}" ]; then
            CHANGES="(no file changes detected)"
          fi

          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Build the changelist block safely without heredocs to avoid YAML parsing issues
          NEW_BLOCK=$(printf "%s\n" \
            "<!-- CHANGELOG:START -->" \
            "## Latest PR Change List (auto-updated)" \
            "" \
            "Base: ${BASE_REF}" \
            "Head: ${HEAD_REF}" \
            "" \
            "Changes:" \
            "${CHANGES}" \
            "" \
            "Updated: ${TS}" \
            "<!-- CHANGELOG:END -->")

          # Remove existing block if present, then append the new block
          if grep -q "<!-- CHANGELOG:START -->" README.md; then
            sed -i '/<!-- CHANGELOG:START -->/,/<!-- CHANGELOG:END -->/d' README.md
          fi
          printf "\n%s\n" "$NEW_BLOCK" >> README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Ensure pushes use the PAT to avoid permission issues
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git"

          git add README.md || true
          if git diff --cached --quiet; then
            echo "No README changes to commit."
          else
            git commit -m "docs(README): auto-update change list for PR ${{ github.event.pull_request.number }}"
            git push origin "HEAD:${HEAD_REF}"
          fi
