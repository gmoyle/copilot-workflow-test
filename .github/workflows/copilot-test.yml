name: Copilot CLI Test

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  copilot-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Verify GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh --version

      - name: Install Copilot extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Installing GitHub Copilot CLI extension..."
          gh extension install github/gh-copilot || echo "Extension may already be installed or unavailable"

      - name: Test Copilot CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Testing Copilot CLI availability..."
          gh copilot --version || echo "Copilot CLI not available or authentication failed"

      - name: Update README with changelist (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "Base ref: ${BASE_REF}"
          echo "Head ref: ${HEAD_REF}"

          git fetch origin "${BASE_REF}"
          git fetch origin "${HEAD_REF}"

          echo "Generating changelist..."
          CHANGES=$(git diff --name-status "origin/${BASE_REF}...origin/${HEAD_REF}" | sed 's/^/ - /')
          if [ -z "${CHANGES}" ]; then
            CHANGES="(no file changes detected)"
          fi

          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          NEW_BLOCK=$(cat <<'EOT'
<!-- CHANGELOG:START -->
## Latest PR Change List (auto-updated)

EOT
)
          NEW_BLOCK+=$'Base: '${BASE_REF}$'\n'
          NEW_BLOCK+=$'Head: '${HEAD_REF}$'\n\n'
          NEW_BLOCK+=$'Changes:\n'
          NEW_BLOCK+="$CHANGES"
          NEW_BLOCK+=$'\n\nUpdated: '
          NEW_BLOCK+="$TS"
          NEW_BLOCK+=$'\n<!-- CHANGELOG:END -->\n'

          if grep -q "<!-- CHANGELOG:START -->" README.md; then
            # Replace existing block between markers
            awk 'BEGIN{p=1} /<!-- CHANGELOG:START -->/{print; p=0; print_block=1; next} /<!-- CHANGELOG:END -->/{print; p=1; print_block=0; next} p{print}' README.md > README.tmp
            # Now insert NEW_BLOCK over the markers in README.tmp
            awk -v block="$NEW_BLOCK" '
              BEGIN{printed=0}
              {
                if ($0 ~ /<!-- CHANGELOG:START -->/) { print block; skip=1 }
                else if (skip && $0 ~ /<!-- CHANGELOG:END -->/) { skip=0 }
                else if (!skip) { print }
              }' README.tmp > README.md || true
          else
            printf "\n%s\n" "$NEW_BLOCK" >> README.md
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md || true
          if git diff --cached --quiet; then
            echo "No README changes to commit."
          else
            git commit -m "docs(README): auto-update change list for PR ${{ github.event.pull_request.number }}"
            git push origin "HEAD:${HEAD_REF}"
          fi
